[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty-commits"
version = "1.0.1"
authors = [
  { name="SmauDistribution"},
]
description = "A simple, interactive Python CLI to craft beautiful Conventional Commits."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# Crea il comando eseguibile da terminale
[project.scripts]
beautycommit = "beauty_commits.cli:main"
bcommit = "beauty_commits.cli:main"
bc = "beauty_commits.cli:main"

[project.urls]
Homepage = "https://github.com/SmauDistribution/beauty-commits"
Repository = "https://github.com/SmauDistribution/beauty-commits.git"